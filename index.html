<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Astute World Cup Sweepstake</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap");

      :root {
        color-scheme: light;
        --astute-blue: #0091d2;
        --ink: #102535;
        --muted: #5c7484;
        --paper: #ffffff;
        --panel: #ffffff;
        --soft-blue: #e9f7fd;
        --line: #c9e8f7;
        --green: #177a52;
        --red: #b34338;
        --shadow: 0 24px 60px rgba(0, 76, 116, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(0, 145, 210, 0.12), rgba(255, 255, 255, 0) 22rem),
          linear-gradient(135deg, rgba(0, 145, 210, 0.08) 0 25%, transparent 25% 50%, rgba(0, 145, 210, 0.04) 50% 75%, transparent 75%),
          var(--paper);
        background-size: auto, 32px 32px, auto;
        font-family: Ubuntu, "Trebuchet MS", sans-serif;
      }

      img {
        max-width: 100%;
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 390px);
        gap: 32px;
        align-items: center;
        margin-bottom: 26px;
      }

      .brand-line {
        display: flex;
        gap: 16px;
        justify-content: flex-end;
        align-items: center;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.9);
        font-size: 0.84rem;
        font-weight: 700;
        text-decoration: none;
      }

      .nav-link:hover {
        border-color: var(--astute-blue);
        color: var(--astute-blue);
      }

      .astute-logo {
        width: min(100%, 360px);
        height: 153px;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--astute-blue);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: 5rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .stat {
        min-height: 112px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .stat strong {
        display: block;
        margin-top: 12px;
        font-size: 2.2rem;
        line-height: 1;
        overflow-wrap: anywhere;
      }

      .board {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      .groups {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .board-header {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--astute-blue);
        color: white;
      }

      .board-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .group-prize {
        display: block;
        margin-top: 8px;
        color: white;
        font-size: 1.45rem;
        font-weight: 700;
        line-height: 1;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 0;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        background: var(--soft-blue);
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .entrant {
        font-size: 1.12rem;
        font-weight: 700;
      }

      .team-cell {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 190px;
      }

      .team-name {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 8px;
        align-items: center;
        width: 100%;
      }

      .flag {
        width: 42px;
        height: 28px;
        flex: 0 0 auto;
        border: 1px solid rgba(23, 20, 16, 0.18);
        border-radius: 4px;
        object-fit: cover;
        background: #eee;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .pill.yes {
        color: #0f5135;
        background: rgba(23, 122, 82, 0.14);
      }

      .pill.no {
        color: #7b2d25;
        background: rgba(179, 67, 56, 0.14);
      }

      .team-status {
        justify-content: center;
        min-height: 24px;
        min-width: 88px;
        padding: 0 8px;
        font-size: 0.72rem;
        white-space: nowrap;
      }

      .empty {
        padding: 46px 20px;
        color: var(--muted);
        text-align: center;
      }

      .notice {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding: 24px 0;
        }

        .astute-logo {
          width: 254px;
          height: 108px;
        }

        h1 {
          font-size: 2.75rem;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .summary .stat:first-child,
        .summary .stat:last-child {
          grid-column: 1 / -1;
        }

        .groups {
          grid-template-columns: 1fr;
        }

        .stat {
          min-height: 96px;
          padding: 14px;
        }

        .stat strong {
          font-size: 1.65rem;
        }

        .board-header {
          display: block;
        }

      }

      @media (max-width: 640px) {
        body {
          background:
            linear-gradient(180deg, rgba(0, 145, 210, 0.14), rgba(255, 255, 255, 0) 18rem),
            var(--paper);
        }

        .page {
          width: min(100% - 16px, 1120px);
          padding: 18px 0 28px;
        }

        .masthead {
          display: flex;
          flex-direction: column-reverse;
          gap: 16px;
          align-items: flex-start;
          margin-bottom: 18px;
        }

        .brand-line {
          width: 100%;
          justify-content: space-between;
        }

        .astute-logo {
          width: 218px;
          height: 92px;
        }

        .nav-link {
          min-height: 38px;
          padding: 0 10px;
          font-size: 0.76rem;
        }

        .eyebrow {
          font-size: 0.74rem;
        }

        h1 {
          font-size: 2.25rem;
          line-height: 1.05;
        }

        .summary {
          gap: 8px;
          margin-bottom: 12px;
        }

        .stat {
          min-height: 82px;
          padding: 12px;
        }

        .stat span {
          font-size: 0.7rem;
        }

        .stat strong {
          margin-top: 8px;
          font-size: 1.45rem;
        }

        .board {
          border-radius: 8px;
        }

        .board-header {
          padding: 14px;
        }

        .board-header h2 {
          font-size: 1rem;
        }

        .group-prize {
          font-size: 1.2rem;
        }

        .table-wrap {
          overflow: visible;
        }

        table,
        thead,
        tbody,
        tr,
        td {
          display: block;
          width: 100%;
        }

        table {
          min-width: 0;
        }

        thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          white-space: nowrap;
        }

        tbody {
          padding: 8px;
          background: var(--soft-blue);
        }

        tr {
          margin-bottom: 8px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: white;
          overflow: hidden;
        }

        tr:last-child {
          margin-bottom: 0;
        }

        td {
          display: grid;
          grid-template-columns: minmax(92px, 34%) 1fr;
          gap: 12px;
          align-items: center;
          padding: 12px;
          border-bottom: 1px solid var(--line);
        }

        td::before {
          content: attr(data-label);
          color: var(--muted);
          font-size: 0.72rem;
          font-weight: 700;
          text-transform: uppercase;
        }

        .entrant {
          font-size: 1rem;
        }

        .team-cell {
          min-width: 0;
          gap: 10px;
        }

        .flag {
          width: 36px;
          height: 24px;
        }

        .pill {
          justify-self: start;
        }

        .empty {
          display: block;
          padding: 28px 12px;
        }

        .empty::before {
          content: "";
        }

        .notice {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="hero-copy">
          <p class="eyebrow">Group 1 &amp; Group 2</p>
          <h1>Astute World Cup Sweepstake</h1>
        </div>
        <div class="brand-line">
          <a class="nav-link" href="assign.html">Assign teams</a>
          <img class="astute-logo" src="assets/astute-logo-tagline.png" alt="Astute">
        </div>
      </header>

      <section class="summary" aria-label="Sweepstake summary">
        <article class="stat">
          <span>Buy in</span>
          <strong id="buy-in">-</strong>
        </article>
        <article class="stat">
          <span>Entrants</span>
          <strong id="entrant-count">-</strong>
        </article>
        <article class="stat">
          <span>Paid</span>
          <strong id="paid-count">-</strong>
        </article>
        <article class="stat">
          <span>Still in</span>
          <strong id="active-count">-</strong>
        </article>
        <article class="stat">
          <span>Combined pots</span>
          <strong id="prize-pot">-</strong>
        </article>
      </section>

      <div class="groups">
        <section class="board" aria-labelledby="group-1-title">
          <div class="board-header">
            <div>
              <h2 id="group-1-title">Group 1</h2>
              <span class="group-prize" id="prize-group-1">Prize pot -</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Team</th>
                  <th>Paid?</th>
                </tr>
              </thead>
              <tbody id="entries-group-1">
                <tr>
                  <td class="empty" colspan="3">Loading entries...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="board" aria-labelledby="group-2-title">
          <div class="board-header">
            <div>
              <h2 id="group-2-title">Group 2</h2>
              <span class="group-prize" id="prize-group-2">Prize pot -</span>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Team</th>
                  <th>Paid?</th>
                </tr>
              </thead>
              <tbody id="entries-group-2">
                <tr>
                  <td class="empty" colspan="3">Loading entries...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
      <p class="notice" id="notice"></p>
    </main>

    <script>
      const sheetBaseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbvGbdDL3Mn9M5YGGvvB9ZuFrA-naqeTDfOUJxFWxblSy6UkZaCoig13As4ufsfmJcrEQ5nVUwandr/pub";
      const sheetTabs = {
        group1: { title: "Group 1", gid: "0", entriesId: "entries-group-1", prizeId: "prize-group-1" },
        group2: { title: "Group 2", gid: "841055588", entriesId: "entries-group-2", prizeId: "prize-group-2" },
        allTeams: { title: "All Teams", gid: "1603349445" },
        teams: { title: "Teams Flag Codes", gid: "1437858886" }
      };
      const fallbackData = {
        group1: `First Name,Last initial,Team,Paid?,,,Buy in Amount,£10.00
TEST,1,England,TRUE,,,Total Prize Pot,£30.00
TEST,2,France,TRUE,,,,
TEST,3,Canada,TRUE,,,,`,
        group2: `First Name,Last initial,Team,Paid?,,,Buy in Amount,£10.00
TEST,1,England,TRUE,,,Total Prize Pot,£30.00
TEST,2,France,TRUE,,,,
TEST,3,Canada,TRUE,,,,`,
        allTeams: `Confederation,Country,Eliminated?
Host,Canada,FALSE
UEFA,England,FALSE
UEFA,France,FALSE`,
        teams: `Confederation,Country,FIFA Code,ISO Code,Eliminated?
Host,Canada,CAN,CA,FALSE
UEFA,England,ENG,GB,FALSE
UEFA,France,FRA,FR,FALSE`
      };
      let hasLoadedLiveData = false;

      const flagImages = {
        EN: "https://flagcdn.com/w80/gb-eng.png",
        ENG: "https://flagcdn.com/w80/gb-eng.png",
        GB: "https://flagcdn.com/w80/gb.png",
        UK: "https://flagcdn.com/w80/gb.png",
        SC: "https://flagcdn.com/w80/gb-sct.png",
        SCO: "https://flagcdn.com/w80/gb-sct.png",
        WA: "https://flagcdn.com/w80/gb-wls.png",
        WAL: "https://flagcdn.com/w80/gb-wls.png",
        NI: "https://flagcdn.com/w80/gb-nir.png"
      };

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && quoted && next === '"') {
            value += '"';
            i += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(value);
            if (row.some((cell) => cell.trim() !== "")) rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }

        row.push(value);
        if (row.some((cell) => cell.trim() !== "")) rows.push(row);
        return rows;
      }

      function moneyToNumber(value) {
        const parsed = Number(String(value).replace(/[^0-9.-]/g, ""));
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function formatMoney(amount) {
        return new Intl.NumberFormat("en-GB", {
          style: "currency",
          currency: "GBP"
        }).format(amount);
      }

      function findSummary(rows, label) {
        const normalised = label.toLowerCase();
        for (const row of rows) {
          const index = row.findIndex((cell) => cell.trim().toLowerCase() === normalised);
          if (index >= 0) return (row[index + 1] || "").trim();
        }
        return "";
      }

      function truthy(value) {
        return ["true", "yes", "y", "paid", "1"].includes(String(value).trim().toLowerCase());
      }

      function getSheetUrl(gid) {
        const url = window.location.protocol === "file:"
          ? new URL(sheetBaseUrl)
          : new URL("/api/sheet", window.location.href);

        url.searchParams.set("gid", gid);
        url.searchParams.set("single", "true");
        url.searchParams.set("output", "csv");
        url.searchParams.set("cacheBust", Date.now());
        return url.toString();
      }

      function normaliseHeader(value) {
        return String(value).trim().toLowerCase();
      }

      function cell(row, indexes, name) {
        const index = indexes.get(normaliseHeader(name));
        return index === undefined ? "" : (row[index] || "").trim();
      }

      function normaliseTeamName(value) {
        return String(value).trim().toLowerCase();
      }

      function cleanFlagCode(value) {
        return String(value).trim().toUpperCase().replace(/[^A-Z]/g, "");
      }

      function parseTeamMetadata(flagCsvText, eliminationCsvText) {
        const eliminationRows = parseCsv(eliminationCsvText);
        const eliminationHeaders = eliminationRows[0] || [];
        const eliminationIndexes = new Map(eliminationHeaders.map((header, index) => [normaliseHeader(header), index]));
        const eliminations = new Map(eliminationRows.slice(1).map((row) => {
          const country = cell(row, eliminationIndexes, "Country");
          if (!country) return null;
          return [normaliseTeamName(country), truthy(cell(row, eliminationIndexes, "Eliminated?"))];
        }).filter(Boolean));

        const rows = parseCsv(flagCsvText);
        const headers = rows[0] || [];
        const indexes = new Map(headers.map((header, index) => [normaliseHeader(header), index]));

        return new Map(rows.slice(1).map((row) => {
          const country = cell(row, indexes, "Country");
          if (!country) return null;

          return [normaliseTeamName(country), {
            country,
            fifaCode: cleanFlagCode(cell(row, indexes, "FIFA Code")),
            isoCode: cleanFlagCode(cell(row, indexes, "ISO Code")),
            eliminated: eliminations.get(normaliseTeamName(country)) || false
          }];
        }).filter(Boolean));
      }

      function parseGroup(csvText, teamMetadata) {
        const rows = parseCsv(csvText);
        const headers = rows[0] || [];
        const indexes = new Map(headers.map((header, index) => [normaliseHeader(header), index]));
        const entries = rows.slice(1).filter((row) => {
          return cell(row, indexes, "First Name") || cell(row, indexes, "Last Name") || cell(row, indexes, "Last initial") || cell(row, indexes, "Team");
        }).map((row) => {
          const team = cell(row, indexes, "Team");
          const metadata = teamMetadata.get(normaliseTeamName(team)) || {};

          return {
            firstName: cell(row, indexes, "First Name"),
            lastName: cell(row, indexes, "Last Name") || cell(row, indexes, "Last initial"),
            team,
            paid: truthy(cell(row, indexes, "Paid?")),
            fifaCode: metadata.fifaCode || "",
            isoCode: metadata.isoCode || "",
            eliminated: Boolean(metadata.eliminated)
          };
        });

        return {
          entries,
          buyIn: findSummary(rows, "Buy in Amount") || headers[7] || "",
          prizePot: findSummary(rows, "Total Prize Pot") || ""
        };
      }

      function render(data, source = "live") {
        const fromFallback = source === "fallback";
        const teamMetadata = parseTeamMetadata(data.teams, data.allTeams);
        const groups = [
          { key: "group1", ...sheetTabs.group1, ...parseGroup(data.group1, teamMetadata) },
          { key: "group2", ...sheetTabs.group2, ...parseGroup(data.group2, teamMetadata) }
        ].map((group) => {
          const calculatedPrizePot = moneyToNumber(group.buyIn) * group.entries.length;
          const prizePot = group.prizePot || (calculatedPrizePot > 0 ? formatMoney(calculatedPrizePot) : "");
          return { ...group, prizePot };
        });
        const entries = groups.flatMap((group) => group.entries);
        const buyIn = groups.find((group) => group.buyIn)?.buyIn || "";
        const combinedPrizePot = groups.map((group) => moneyToNumber(group.prizePot)).reduce((total, amount) => total + amount, 0);
        const paidCount = entries.filter((entry) => entry.paid).length;
        const activeCount = entries.filter((entry) => !entry.eliminated).length;

        document.getElementById("entrant-count").textContent = entries.length;
        document.getElementById("paid-count").textContent = paidCount;
        document.getElementById("active-count").textContent = activeCount;
        document.getElementById("buy-in").textContent = buyIn || "-";
        document.getElementById("prize-pot").textContent = combinedPrizePot > 0 ? formatMoney(combinedPrizePot) : "-";
        groups.forEach((group) => {
          document.getElementById(group.prizeId).textContent = `Prize pot ${group.prizePot || "-"}`;
        });
        document.getElementById("notice").textContent = fromFallback
          ? "Showing the saved copy because the live spreadsheet could not be reached."
          : "Reading from the live published spreadsheet.";

        groups.forEach((group) => renderGroup(group));
      }

      function renderGroup(group) {
        const tbody = document.getElementById(group.entriesId);
        if (group.entries.length === 0) {
          tbody.innerHTML = `<tr><td class="empty" colspan="3">No entries found in the spreadsheet.</td></tr>`;
          return;
        }

        tbody.innerHTML = group.entries.map((entry) => {
          const displayName = [entry.firstName, entry.lastName].filter(Boolean).join(" ");
          const flagSrc = flagImages[entry.fifaCode] || flagImages[entry.isoCode] || `https://flagcdn.com/w80/${entry.isoCode.toLowerCase()}.png`;
          const flag = entry.fifaCode || entry.isoCode
            ? `<img class="flag" src="${flagSrc}" alt="" loading="lazy" onerror="this.style.display='none'">`
            : "";
          return `
            <tr>
              <td class="entrant" data-label="Name">${escapeHtml(displayName)}</td>
              <td data-label="Team">
                <div class="team-cell">
                  ${flag}
                  <span class="team-name">
                    <span>${escapeHtml(entry.team)}</span>
                    <span class="pill team-status ${entry.eliminated ? "no" : "yes"}">${entry.eliminated ? "Eliminated" : "Still in"}</span>
                  </span>
                </div>
              </td>
              <td data-label="Paid?"><span class="pill ${entry.paid ? "yes" : "no"}">${entry.paid ? "Paid" : "Not paid"}</span></td>
            </tr>
          `;
        }).join("");
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function loadSpreadsheet() {
        Promise.all(Object.entries(sheetTabs).map(([key, tab]) => (
          fetch(getSheetUrl(tab.gid), { cache: "reload" })
            .then((response) => {
              if (!response.ok) throw new Error(`${tab.title} returned ${response.status}`);
              return response.text();
            })
            .then((text) => [key, text])
        )))
          .then((sheets) => {
            hasLoadedLiveData = true;
            render(Object.fromEntries(sheets), "live");
          })
          .catch((error) => {
            console.warn("Could not load live spreadsheet", error);
            if (!hasLoadedLiveData) {
              render(fallbackData, "fallback");
              return;
            }

            document.getElementById("notice").textContent = "Could not reach the live spreadsheet on this refresh, so the last loaded live values are still shown.";
          });
      }

      loadSpreadsheet();
      setInterval(loadSpreadsheet, 60000);
    </script>
  </body>
</html>
