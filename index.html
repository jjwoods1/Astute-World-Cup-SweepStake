<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Astute World Cup Sweepstake</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap");

      :root {
        color-scheme: light;
        --astute-blue: #0091d2;
        --ink: #102535;
        --muted: #5c7484;
        --paper: #ffffff;
        --panel: #ffffff;
        --soft-blue: #e9f7fd;
        --line: #c9e8f7;
        --green: #177a52;
        --red: #b34338;
        --shadow: 0 24px 60px rgba(0, 76, 116, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(0, 145, 210, 0.12), rgba(255, 255, 255, 0) 22rem),
          linear-gradient(135deg, rgba(0, 145, 210, 0.08) 0 25%, transparent 25% 50%, rgba(0, 145, 210, 0.04) 50% 75%, transparent 75%),
          var(--paper);
        background-size: auto, 32px 32px, auto;
        font-family: Ubuntu, "Trebuchet MS", sans-serif;
      }

      img {
        max-width: 100%;
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 390px);
        gap: 32px;
        align-items: center;
        margin-bottom: 26px;
      }

      .brand-line {
        display: flex;
        justify-content: flex-end;
        align-items: center;
      }

      .astute-logo {
        width: min(100%, 360px);
        height: 153px;
        object-fit: contain;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--astute-blue);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: 5rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .stat {
        min-height: 112px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset;
      }

      .stat span {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .stat strong {
        display: block;
        margin-top: 12px;
        font-size: 2.2rem;
        line-height: 1;
        overflow-wrap: anywhere;
      }

      .board {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
      }

      .board-header {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--astute-blue);
        color: white;
      }

      .board-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .updated {
        color: rgba(255, 255, 255, 0.86);
        font-size: 0.85rem;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 620px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 15px 18px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: var(--muted);
        background: var(--soft-blue);
        font-size: 0.76rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .entrant {
        font-size: 1.12rem;
        font-weight: 700;
      }

      .team-cell {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 190px;
      }

      .flag {
        width: 42px;
        height: 28px;
        flex: 0 0 auto;
        border: 1px solid rgba(23, 20, 16, 0.18);
        border-radius: 4px;
        object-fit: cover;
        background: #eee;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
      }

      .pill.yes {
        color: #0f5135;
        background: rgba(23, 122, 82, 0.14);
      }

      .pill.no {
        color: #7b2d25;
        background: rgba(179, 67, 56, 0.14);
      }

      .empty {
        padding: 46px 20px;
        color: var(--muted);
        text-align: center;
      }

      .notice {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding: 24px 0;
        }

        .astute-logo {
          width: 254px;
          height: 108px;
        }

        h1 {
          font-size: 2.75rem;
        }

        .summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .summary .stat:first-child,
        .summary .stat:last-child {
          grid-column: 1 / -1;
        }

        .stat {
          min-height: 96px;
          padding: 14px;
        }

        .stat strong {
          font-size: 1.65rem;
        }

        .board-header {
          display: block;
        }

        .updated {
          display: block;
          margin-top: 8px;
        }
      }

      @media (max-width: 640px) {
        body {
          background:
            linear-gradient(180deg, rgba(0, 145, 210, 0.14), rgba(255, 255, 255, 0) 18rem),
            var(--paper);
        }

        .page {
          width: min(100% - 16px, 1120px);
          padding: 18px 0 28px;
        }

        .masthead {
          display: flex;
          flex-direction: column-reverse;
          gap: 16px;
          align-items: flex-start;
          margin-bottom: 18px;
        }

        .brand-line {
          width: 100%;
          justify-content: flex-start;
        }

        .astute-logo {
          width: 218px;
          height: 92px;
        }

        .eyebrow {
          font-size: 0.74rem;
        }

        h1 {
          font-size: 2.25rem;
          line-height: 1.05;
        }

        .summary {
          gap: 8px;
          margin-bottom: 12px;
        }

        .stat {
          min-height: 82px;
          padding: 12px;
        }

        .stat span {
          font-size: 0.7rem;
        }

        .stat strong {
          margin-top: 8px;
          font-size: 1.45rem;
        }

        .board {
          border-radius: 8px;
        }

        .board-header {
          padding: 14px;
        }

        .board-header h2 {
          font-size: 1rem;
        }

        .updated {
          font-size: 0.78rem;
          line-height: 1.35;
        }

        .table-wrap {
          overflow: visible;
        }

        table,
        thead,
        tbody,
        tr,
        td {
          display: block;
          width: 100%;
        }

        table {
          min-width: 0;
        }

        thead {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          white-space: nowrap;
        }

        tbody {
          padding: 8px;
          background: var(--soft-blue);
        }

        tr {
          margin-bottom: 8px;
          border: 1px solid var(--line);
          border-radius: 8px;
          background: white;
          overflow: hidden;
        }

        tr:last-child {
          margin-bottom: 0;
        }

        td {
          display: grid;
          grid-template-columns: minmax(92px, 34%) 1fr;
          gap: 12px;
          align-items: center;
          padding: 12px;
          border-bottom: 1px solid var(--line);
        }

        td::before {
          content: attr(data-label);
          color: var(--muted);
          font-size: 0.72rem;
          font-weight: 700;
          text-transform: uppercase;
        }

        .entrant {
          font-size: 1rem;
        }

        .team-cell {
          min-width: 0;
          gap: 10px;
        }

        .flag {
          width: 36px;
          height: 24px;
        }

        .pill {
          justify-self: start;
        }

        .empty {
          display: block;
          padding: 28px 12px;
        }

        .empty::before {
          content: "";
        }

        .notice {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div class="hero-copy">
          <p class="eyebrow">Group 1</p>
          <h1>Astute World Cup Sweepstake</h1>
        </div>
        <div class="brand-line">
          <img class="astute-logo" src="assets/astute-logo-tagline.png" alt="Astute">
        </div>
      </header>

      <section class="summary" aria-label="Sweepstake summary">
        <article class="stat">
          <span>Buy in</span>
          <strong id="buy-in">-</strong>
        </article>
        <article class="stat">
          <span>Entrants</span>
          <strong id="entrant-count">-</strong>
        </article>
        <article class="stat">
          <span>Paid</span>
          <strong id="paid-count">-</strong>
        </article>
        <article class="stat">
          <span>Still in</span>
          <strong id="active-count">-</strong>
        </article>
        <article class="stat">
          <span>Prize pot</span>
          <strong id="prize-pot">-</strong>
        </article>
      </section>

      <section class="board" aria-labelledby="table-title">
        <div class="board-header">
          <h2 id="table-title">Sweepstake entries</h2>
          <span class="updated" id="updated">Loading spreadsheet...</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Team</th>
                <th>Paid?</th>
                <th>Eliminated?</th>
              </tr>
            </thead>
            <tbody id="entries">
              <tr>
                <td class="empty" colspan="4">Loading entries...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      <p class="notice" id="notice"></p>
    </main>

    <script>
      const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbvGbdDL3Mn9M5YGGvvB9ZuFrA-naqeTDfOUJxFWxblSy6UkZaCoig13As4ufsfmJcrEQ5nVUwandr/pub?output=csv";
      const csvUrl = window.location.protocol === "file:" ? sheetCsvUrl : "/api/sheet";
      const fallbackCsv = `First Name,Last initial,Team,Country Flag Code,Paid?,Eliminated?,,,Buy in Amount,£10.00
Jaidon,W,England,EN,TRUE,TRUE,,,Total Prize Pot,`;
      let hasLoadedLiveData = false;

      const flagImages = {
        EN: "https://flagcdn.com/w80/gb-eng.png",
        ENG: "https://flagcdn.com/w80/gb-eng.png",
        GB: "https://flagcdn.com/w80/gb.png",
        UK: "https://flagcdn.com/w80/gb.png",
        SC: "https://flagcdn.com/w80/gb-sct.png",
        SCO: "https://flagcdn.com/w80/gb-sct.png",
        WA: "https://flagcdn.com/w80/gb-wls.png",
        WAL: "https://flagcdn.com/w80/gb-wls.png",
        NI: "https://flagcdn.com/w80/gb-nir.png"
      };

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && quoted && next === '"') {
            value += '"';
            i += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(value);
            if (row.some((cell) => cell.trim() !== "")) rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }

        row.push(value);
        if (row.some((cell) => cell.trim() !== "")) rows.push(row);
        return rows;
      }

      function moneyToNumber(value) {
        const parsed = Number(String(value).replace(/[^0-9.-]/g, ""));
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function formatMoney(amount) {
        return new Intl.NumberFormat("en-GB", {
          style: "currency",
          currency: "GBP"
        }).format(amount);
      }

      function findSummary(rows, label) {
        const normalised = label.toLowerCase();
        for (const row of rows) {
          const index = row.findIndex((cell) => cell.trim().toLowerCase() === normalised);
          if (index >= 0) return (row[index + 1] || "").trim();
        }
        return "";
      }

      function truthy(value) {
        return ["true", "yes", "y", "paid", "1"].includes(String(value).trim().toLowerCase());
      }

      function render(csvText, source = "live") {
        const fromFallback = source === "fallback";
        const rows = parseCsv(csvText);
        const headers = rows[0] || [];
        const dataRows = rows.slice(1).filter((row) => row[0] || row[1] || row[2]);
        const entries = dataRows.map((row) => ({
          firstName: row[0] || "",
          lastInitial: row[1] || "",
          team: row[2] || "",
          flagCode: (row[3] || "").trim().toUpperCase(),
          paid: truthy(row[4]),
          eliminated: truthy(row[5])
        })).sort((a, b) => Number(a.eliminated) - Number(b.eliminated));

        const buyIn = findSummary(rows, "Buy in Amount") || headers[9] || "";
        const prizePot = findSummary(rows, "Total Prize Pot") || formatMoney(moneyToNumber(buyIn) * entries.length);
        const paidCount = entries.filter((entry) => entry.paid).length;
        const activeCount = entries.filter((entry) => !entry.eliminated).length;

        document.getElementById("entrant-count").textContent = entries.length;
        document.getElementById("paid-count").textContent = paidCount;
        document.getElementById("active-count").textContent = activeCount;
        document.getElementById("buy-in").textContent = buyIn || "-";
        document.getElementById("prize-pot").textContent = prizePot || "-";
        const checkedAt = new Date().toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
        document.getElementById("updated").textContent = fromFallback
          ? `Fallback copy loaded ${checkedAt}`
          : `Live sheet checked ${checkedAt}`;
        document.getElementById("notice").textContent = fromFallback
          ? "Showing the saved copy because the live spreadsheet could not be reached."
          : "Reading from the live published spreadsheet.";

        const tbody = document.getElementById("entries");
        if (entries.length === 0) {
          tbody.innerHTML = `<tr><td class="empty" colspan="4">No entries found in the spreadsheet.</td></tr>`;
          return;
        }

        tbody.innerHTML = entries.map((entry) => {
          const displayName = [entry.firstName, entry.lastInitial].filter(Boolean).join(" ");
          const flagSrc = flagImages[entry.flagCode] || `https://flagcdn.com/w80/${entry.flagCode.toLowerCase()}.png`;
          return `
            <tr>
              <td class="entrant" data-label="Name">${escapeHtml(displayName)}</td>
              <td data-label="Team">
                <div class="team-cell">
                  <img class="flag" src="${flagSrc}" alt="" loading="lazy" onerror="this.style.display='none'">
                  <span>${escapeHtml(entry.team)}</span>
                </div>
              </td>
              <td data-label="Paid?"><span class="pill ${entry.paid ? "yes" : "no"}">${entry.paid ? "Paid" : "Not paid"}</span></td>
              <td data-label="Eliminated?"><span class="pill ${entry.eliminated ? "no" : "yes"}">${entry.eliminated ? "Eliminated" : "Still in"}</span></td>
            </tr>
          `;
        }).join("");
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function loadSpreadsheet() {
        const liveUrl = new URL(csvUrl, window.location.href);
        liveUrl.searchParams.set("cacheBust", Date.now());

        fetch(liveUrl.toString(), { cache: "reload" })
          .then((response) => {
            if (!response.ok) throw new Error(`Spreadsheet returned ${response.status}`);
            return response.text();
          })
          .then((text) => {
            hasLoadedLiveData = true;
            render(text, "live");
          })
          .catch((error) => {
            console.warn("Could not load live spreadsheet", error);
            if (!hasLoadedLiveData) {
              render(fallbackCsv, "fallback");
              return;
            }

            document.getElementById("updated").textContent = `Live refresh failed ${new Date().toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}`;
            document.getElementById("notice").textContent = "Could not reach the live spreadsheet on this refresh, so the last loaded live values are still shown.";
          });
      }

      loadSpreadsheet();
      setInterval(loadSpreadsheet, 60000);
    </script>
  </body>
</html>
