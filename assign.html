<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assign Teams | Astute World Cup Sweepstake</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap");

      :root {
        color-scheme: light;
        --astute-blue: #0091d2;
        --astute-blue-light: #5ec2ee;
        --ink: #102535;
        --muted: #5c7484;
        --paper: #ffffff;
        --soft-blue: #e9f7fd;
        --line: #c9e8f7;
        --green: #177a52;
        --yellow: #f6c34a;
        --red: #b34338;
        --shadow: 0 24px 60px rgba(0, 76, 116, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(0, 145, 210, 0.12), rgba(255, 255, 255, 0) 22rem),
          linear-gradient(135deg, rgba(0, 145, 210, 0.08) 0 25%, transparent 25% 50%, rgba(246, 195, 74, 0.08) 50% 75%, transparent 75%),
          var(--paper);
        background-size: auto, 32px 32px, auto;
        font-family: Ubuntu, "Trebuchet MS", sans-serif;
      }

      img {
        max-width: 100%;
      }

      button,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* Confetti overlay */
      #confetti {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 60;
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 34px 0 42px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 390px);
        gap: 32px;
        align-items: center;
        margin-bottom: 24px;
      }

      .brand-line {
        display: flex;
        gap: 16px;
        justify-content: flex-end;
        align-items: center;
      }

      .astute-logo {
        width: min(100%, 330px);
        height: 140px;
        object-fit: contain;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.9);
        font-size: 0.84rem;
        font-weight: 700;
        text-decoration: none;
      }

      .nav-link:hover {
        border-color: var(--astute-blue);
        color: var(--astute-blue);
      }

      .eyebrow {
        margin: 0 0 10px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--astute-blue);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .eyebrow::before {
        content: "";
        width: 26px;
        height: 3px;
        border-radius: 2px;
        background: var(--astute-blue);
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: 4.7rem;
        line-height: 1;
      }

      h1 .accent {
        color: var(--astute-blue);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(160px, 1fr) auto auto;
        gap: 12px;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid var(--line);
        background: var(--soft-blue);
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label,
      .toggle span {
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      select {
        width: 100%;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: white;
        font-weight: 700;
      }

      .toggle {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        white-space: nowrap;
      }

      .toggle input {
        width: 18px;
        height: 18px;
        accent-color: var(--astute-blue);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border: 1px solid var(--astute-blue);
        border-radius: 10px;
        color: white;
        background: var(--astute-blue);
        font-weight: 700;
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }

      .button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .button.secondary {
        color: var(--ink);
        border-color: var(--line);
        background: white;
      }

      .button#draw-button {
        padding: 0 26px;
      }

      .button:hover:not(:disabled) {
        box-shadow: 0 8px 18px rgba(0, 145, 210, 0.28);
      }

      /* On-brand draw stage (the hero) */
      .draw-stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 96px minmax(0, 1fr);
        gap: 16px;
        align-items: stretch;
        padding: 28px 24px;
        overflow: hidden;
        background:
          radial-gradient(130% 95% at 50% -20%, rgba(0, 145, 210, 0.16), transparent 60%),
          linear-gradient(180deg, #f3fbfe, #ffffff);
      }

      .ticket {
        position: relative;
        min-height: 268px;
        padding: 24px 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 14px 32px rgba(0, 76, 116, 0.1);
        overflow: hidden;
      }

      .ticket::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--astute-blue), transparent);
      }

      .ticket-title {
        margin: 0 0 16px;
        color: var(--astute-blue);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .ticket-value {
        min-height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        font-weight: 700;
        font-size: 3rem;
        line-height: 1.05;
        color: var(--ink);
        overflow-wrap: break-word;
      }

      .ticket-meta {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        min-height: 1.2em;
      }

      .flag {
        width: 152px;
        height: 100px;
        margin-bottom: 18px;
        border: 1px solid rgba(23, 20, 16, 0.18);
        border-radius: 8px;
        object-fit: cover;
        background: #eee;
        box-shadow: 0 12px 26px rgba(0, 76, 116, 0.18);
      }

      .flag-slot {
        height: 118px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .flag-placeholder {
        width: 152px;
        height: 100px;
        margin-bottom: 18px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--astute-blue);
        font-size: 1.8rem;
        font-weight: 700;
      }

      /* Spinning + lock states */
      .draw-stage.is-spinning .ticket-value {
        filter: blur(0.4px);
        opacity: 0.92;
      }

      .ticket.locked {
        animation: lock-pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
      }

      .ticket.locked::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 14px;
        box-shadow: 0 0 0 3px var(--astute-blue);
        animation: lock-flash 0.6s ease forwards;
        pointer-events: none;
      }

      @keyframes lock-pop {
        0% { transform: scale(0.9); }
        55% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }

      @keyframes lock-flash {
        0% { opacity: 0.9; }
        100% { opacity: 0; }
      }

      .joiner {
        display: grid;
        place-items: center;
      }

      .medallion {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #ffffff;
        font-size: 2rem;
        font-weight: 700;
        background: radial-gradient(circle at 35% 30%, var(--astute-blue-light), var(--astute-blue) 60%);
        box-shadow: 0 8px 22px rgba(0, 145, 210, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.5);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 18px 20px 20px;
      }

      .payload-toggle {
        margin-left: auto;
        border: none;
        background: none;
        color: var(--astute-blue);
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: underline;
        padding: 6px;
      }

      .side {
        display: grid;
        gap: 12px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .metric {
        min-height: 96px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.96);
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 10px;
        font-weight: 700;
        font-size: 2.1rem;
        line-height: 1;
        color: var(--ink);
      }

      .status {
        min-height: 52px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--muted);
        background: white;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .status.good {
        color: #0f5135;
        border-color: rgba(23, 122, 82, 0.3);
        background: rgba(23, 122, 82, 0.1);
      }

      .status.warn {
        color: #76551c;
        border-color: rgba(246, 195, 74, 0.45);
        background: rgba(246, 195, 74, 0.16);
      }

      .status.bad {
        color: #7b2d25;
        border-color: rgba(179, 67, 56, 0.3);
        background: rgba(179, 67, 56, 0.12);
      }

      pre {
        max-height: 220px;
        margin: 0;
        padding: 14px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f7fbfd;
        color: var(--ink);
        font-size: 0.78rem;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .hidden {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .ticket.locked,
        .ticket.locked::after {
          animation: none;
        }
      }

      /* Stack the draw stage until there's room for a roomy horizontal layout. */
      @media (max-width: 1040px) {
        .draw-stage {
          grid-template-columns: 1fr;
        }

        .joiner {
          min-height: 54px;
        }
      }

      @media (max-width: 860px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding: 24px 0 32px;
        }

        .masthead {
          display: flex;
          flex-direction: column-reverse;
          gap: 16px;
          align-items: flex-start;
        }

        .brand-line {
          width: 100%;
          justify-content: space-between;
        }

        .astute-logo {
          width: 218px;
          height: 92px;
        }

        h1 {
          font-size: 2.55rem;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }

        .draw-stage {
          grid-template-columns: 1fr;
          padding: 22px 16px;
        }

        .joiner {
          min-height: 48px;
        }

        .medallion {
          width: 52px;
          height: 52px;
          font-size: 1.6rem;
        }

        .ticket {
          min-height: 0;
          padding: 20px 16px;
        }

        .ticket-value {
          min-height: 0;
          font-size: 2.3rem;
        }

        .flag {
          width: 128px;
          height: 84px;
        }

        .flag-slot {
          height: 102px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>
    <main class="page">
      <header class="masthead">
        <div>
          <p class="eyebrow">Team assignment</p>
          <h1>Draw a name <span class="accent">&amp;</span> a team</h1>
        </div>
        <div class="brand-line">
          <a class="nav-link" href="index.html">View board</a>
          <img class="astute-logo" src="assets/astute-logo-tagline.png" alt="Astute">
        </div>
      </header>

      <div class="layout">
        <section class="panel" aria-label="Assignment draw">
          <div class="toolbar">
            <div class="field">
              <label for="group-select">Group</label>
              <select id="group-select">
                <option value="group1">Group 1</option>
                <option value="group2">Group 2</option>
              </select>
            </div>
            <label class="toggle">
              <input id="paid-only" type="checkbox">
              <span>Paid only</span>
            </label>
            <button class="button" id="draw-button" type="button">Draw</button>
          </div>

          <div class="draw-stage" id="draw-stage">
            <article class="ticket" id="ticket-name">
              <p class="ticket-title">Name</p>
              <p class="ticket-value" id="draw-name">Ready</p>
              <p class="ticket-meta" id="draw-person-meta">Waiting for the sheet</p>
            </article>

            <div class="joiner" aria-hidden="true">
              <div class="medallion">+</div>
            </div>

            <article class="ticket" id="ticket-team">
              <p class="ticket-title">Team</p>
              <div class="flag-slot">
                <img class="flag hidden" id="draw-flag" alt="">
                <div class="flag-placeholder" id="flag-placeholder">?</div>
              </div>
              <p class="ticket-value" id="draw-team">Ready</p>
              <p class="ticket-meta" id="draw-team-meta">Waiting for the sheet</p>
            </article>
          </div>

          <div class="actions">
            <button class="button" id="send-button" type="button" disabled>Send to workflow</button>
            <button class="button secondary" id="copy-button" type="button" disabled>Copy payload</button>
            <button class="payload-toggle hidden" id="payload-toggle" type="button">Show payload</button>
          </div>
        </section>

        <aside class="side" aria-label="Draw status">
          <div class="metric-grid">
            <article class="metric">
              <span>Names left</span>
              <strong id="names-left">-</strong>
            </article>
            <article class="metric">
              <span>Teams left</span>
              <strong id="teams-left">-</strong>
            </article>
            <article class="metric">
              <span>Assigned</span>
              <strong id="assigned-count">-</strong>
            </article>
            <article class="metric">
              <span>Sheet rows</span>
              <strong id="row-count">-</strong>
            </article>
          </div>
          <div class="status" id="status">Loading live spreadsheet...</div>
          <pre class="hidden" id="payload-preview"></pre>
        </aside>
      </div>
    </main>

    <script>
      const sheetBaseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRbvGbdDL3Mn9M5YGGvvB9ZuFrA-naqeTDfOUJxFWxblSy6UkZaCoig13As4ufsfmJcrEQ5nVUwandr/pub";
      const sheetTabs = {
        group1: { title: "Group 1", gid: "0" },
        group2: { title: "Group 2", gid: "841055588" },
        allTeams: { title: "All Teams", gid: "1603349445" },
        teams: { title: "Teams Flag Codes", gid: "1437858886" }
      };
      const fallbackData = {
        group1: "First Name,Last initial,Team,Paid?\nTest,One,,TRUE\nTest,Two,,FALSE",
        group2: "First Name,Last initial,Team,Paid?\nTest,Three,,TRUE\nTest,Four,,FALSE",
        allTeams: "Confederation,Country,Eliminated?\nHost,Canada,FALSE\nUEFA,England,FALSE\nUEFA,France,FALSE",
        teams: "Confederation,Country,FIFA Code,ISO Code,Eliminated?\nHost,Canada,CAN,CA,FALSE\nUEFA,England,ENG,GB,FALSE\nUEFA,France,FRA,FR,FALSE"
      };

      const flagImages = {
        EN: "https://flagcdn.com/w80/gb-eng.png",
        ENG: "https://flagcdn.com/w80/gb-eng.png",
        GB: "https://flagcdn.com/w80/gb.png",
        UK: "https://flagcdn.com/w80/gb.png",
        SC: "https://flagcdn.com/w80/gb-sct.png",
        SCO: "https://flagcdn.com/w80/gb-sct.png",
        WA: "https://flagcdn.com/w80/gb-wls.png",
        WAL: "https://flagcdn.com/w80/gb-wls.png",
        NI: "https://flagcdn.com/w80/gb-nir.png"
      };

      let state = null;
      let currentAssignment = null;
      let isSpinning = false;
      // Teams committed this session, excluded from the pool immediately so a
      // slow/failed live re-read can't let the same team be drawn twice.
      const assignedHistory = new Set();
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const groupSelect = document.getElementById("group-select");
      const paidOnly = document.getElementById("paid-only");
      const drawButton = document.getElementById("draw-button");
      const sendButton = document.getElementById("send-button");
      const copyButton = document.getElementById("copy-button");
      const payloadPreview = document.getElementById("payload-preview");
      const payloadToggle = document.getElementById("payload-toggle");
      const statusBox = document.getElementById("status");
      const drawStage = document.getElementById("draw-stage");
      const ticketName = document.getElementById("ticket-name");
      const ticketTeam = document.getElementById("ticket-team");
      const flagEl = document.getElementById("draw-flag");
      const flagPlaceholder = document.getElementById("flag-placeholder");
      const nameValue = document.getElementById("draw-name");
      const teamValue = document.getElementById("draw-team");
      const personMeta = document.getElementById("draw-person-meta");
      const teamMeta = document.getElementById("draw-team-meta");

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && quoted && next === '"') {
            value += '"';
            i += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(value);
            if (row.some((cell) => cell.trim() !== "")) rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }

        row.push(value);
        if (row.some((cell) => cell.trim() !== "")) rows.push(row);
        return rows;
      }

      function normaliseHeader(value) {
        return String(value).trim().toLowerCase();
      }

      function normaliseTeamName(value) {
        return String(value).trim().toLowerCase();
      }

      function cleanFlagCode(value) {
        return String(value).trim().toUpperCase().replace(/[^A-Z]/g, "");
      }

      function truthy(value) {
        return ["true", "yes", "y", "paid", "1"].includes(String(value).trim().toLowerCase());
      }

      function cell(row, indexes, name) {
        const index = indexes.get(normaliseHeader(name));
        return index === undefined ? "" : (row[index] || "").trim();
      }

      function getSheetUrl(gid) {
        const url = window.location.protocol === "file:"
          ? new URL(sheetBaseUrl)
          : new URL("/api/sheet", window.location.href);

        url.searchParams.set("gid", gid);
        url.searchParams.set("single", "true");
        url.searchParams.set("output", "csv");
        url.searchParams.set("cacheBust", Date.now());
        return url.toString();
      }

      function parseGroup(csvText, tab) {
        const rows = parseCsv(csvText);
        const headers = rows[0] || [];
        const indexes = new Map(headers.map((header, index) => [normaliseHeader(header), index]));

        return rows.slice(1).map((row, index) => {
          const firstName = cell(row, indexes, "First Name");
          const lastInitial = cell(row, indexes, "Last initial");
          const name = [firstName, lastInitial].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
          if (!name) return null;

          return {
            groupKey: tab.key,
            groupTitle: tab.title,
            sheetGid: tab.gid,
            rowNumber: index + 2,
            firstName,
            lastInitial,
            name,
            team: cell(row, indexes, "Team"),
            paid: truthy(cell(row, indexes, "Paid?"))
          };
        }).filter(Boolean);
      }

      function parseTeams(allTeamsCsv, teamCodesCsv) {
        const codeRows = parseCsv(teamCodesCsv);
        const codeHeaders = codeRows[0] || [];
        const codeIndexes = new Map(codeHeaders.map((header, index) => [normaliseHeader(header), index]));
        const codeMap = new Map(codeRows.slice(1).map((row) => {
          const country = cell(row, codeIndexes, "Country");
          if (!country) return null;
          return [normaliseTeamName(country), {
            fifaCode: cleanFlagCode(cell(row, codeIndexes, "FIFA Code")),
            isoCode: cleanFlagCode(cell(row, codeIndexes, "ISO Code"))
          }];
        }).filter(Boolean));

        const rows = parseCsv(allTeamsCsv);
        const headers = rows[0] || [];
        const indexes = new Map(headers.map((header, index) => [normaliseHeader(header), index]));

        return rows.slice(1).map((row) => {
          const country = cell(row, indexes, "Country");
          if (!country) return null;
          const codes = codeMap.get(normaliseTeamName(country)) || {};

          return {
            country,
            confederation: cell(row, indexes, "Confederation"),
            eliminated: truthy(cell(row, indexes, "Eliminated?")),
            fifaCode: codes.fifaCode || "",
            isoCode: codes.isoCode || ""
          };
        }).filter(Boolean);
      }

      function buildState(data) {
        const group1 = parseGroup(data.group1, { key: "group1", ...sheetTabs.group1 });
        const group2 = parseGroup(data.group2, { key: "group2", ...sheetTabs.group2 });
        return {
          groups: { group1, group2 },
          teams: parseTeams(data.allTeams, data.teams)
        };
      }

      // Live path: build the same state shape from the JSON the n8n read
      // webhook returns (raw rows per tab, including each row's row_number).
      function mapGroupJson(rows, tab) {
        return (rows || []).map((row) => {
          const firstName = String(row["First Name"] || "").trim();
          const lastInitial = String(row["Last initial"] || "").trim();
          const name = [firstName, lastInitial].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
          if (!name) return null;

          return {
            groupKey: tab.key,
            groupTitle: tab.title,
            sheetGid: tab.gid,
            rowNumber: Number(row.row_number),
            firstName,
            lastInitial,
            name,
            team: String(row["Team"] || "").trim(),
            paid: truthy(row["Paid?"])
          };
        }).filter(Boolean);
      }

      function buildStateFromJson(payload) {
        const codeMap = new Map((payload.teamCodes || []).map((row) => {
          const country = String(row["Country"] || "").trim();
          if (!country) return null;
          return [normaliseTeamName(country), {
            fifaCode: cleanFlagCode(row["FIFA Code"] || ""),
            isoCode: cleanFlagCode(row["ISO Code"] || "")
          }];
        }).filter(Boolean));

        const teams = (payload.allTeams || []).map((row) => {
          const country = String(row["Country"] || "").trim();
          if (!country) return null;
          const codes = codeMap.get(normaliseTeamName(country)) || {};
          return {
            country,
            confederation: String(row["Confederation"] || "").trim(),
            eliminated: truthy(row["Eliminated?"]),
            fifaCode: codes.fifaCode || "",
            isoCode: codes.isoCode || ""
          };
        }).filter(Boolean);

        return {
          groups: {
            group1: mapGroupJson(payload.group1, { key: "group1", ...sheetTabs.group1 }),
            group2: mapGroupJson(payload.group2, { key: "group2", ...sheetTabs.group2 })
          },
          teams
        };
      }

      function randomItem(items) {
        if (window.crypto && window.crypto.getRandomValues) {
          const values = new Uint32Array(1);
          window.crypto.getRandomValues(values);
          return items[values[0] % items.length];
        }

        return items[Math.floor(Math.random() * items.length)];
      }

      function getDrawPools() {
        const groupKey = groupSelect.value;
        const entries = state ? state.groups[groupKey] : [];
        // Exclude teams assigned in EITHER group, plus any committed this
        // session, so no team can ever be drawn twice across the sweepstake.
        const allEntries = state ? [...state.groups.group1, ...state.groups.group2] : [];
        const assignedTeams = new Set([
          ...allEntries.map((entry) => normaliseTeamName(entry.team)).filter(Boolean),
          ...assignedHistory
        ]);
        const groupAssignedCount = entries
          .map((entry) => normaliseTeamName(entry.team))
          .filter(Boolean).length;
        const people = entries.filter((entry) => {
          if (entry.team) return false;
          if (paidOnly.checked && !entry.paid) return false;
          return true;
        });
        const teams = state ? state.teams.filter((team) => !assignedTeams.has(normaliseTeamName(team.country))) : [];

        return {
          groupKey,
          entries,
          people,
          teams,
          assignedCount: groupAssignedCount
        };
      }

      function getFlagSrc(team) {
        if (!team) return "";
        return flagImages[team.fifaCode] || flagImages[team.isoCode] || (team.isoCode ? `https://flagcdn.com/w80/${team.isoCode.toLowerCase()}.png` : "");
      }

      function setFlag(team) {
        const flagSrc = getFlagSrc(team);
        if (flagSrc) {
          flagEl.src = flagSrc;
          flagEl.classList.remove("hidden");
          flagPlaceholder.classList.add("hidden");
        } else {
          flagEl.classList.add("hidden");
          flagPlaceholder.classList.remove("hidden");
        }
      }

      function renderCounts() {
        const pools = getDrawPools();
        document.getElementById("names-left").textContent = pools.people.length;
        document.getElementById("teams-left").textContent = pools.teams.length;
        document.getElementById("assigned-count").textContent = pools.assignedCount;
        document.getElementById("row-count").textContent = pools.entries.length;
        drawButton.disabled = isSpinning || !state || pools.people.length === 0 || pools.teams.length === 0;
      }

      function setStatus(message, tone) {
        statusBox.textContent = message;
        statusBox.className = `status ${tone || ""}`.trim();
      }

      function renderAssignment(assignment) {
        nameValue.textContent = assignment.person.name;
        personMeta.textContent = `${assignment.groupTitle}, row ${assignment.person.rowNumber} - ${assignment.person.paid ? "paid" : "not paid"}`;
        teamValue.textContent = assignment.team.country;
        teamMeta.textContent = assignment.team.confederation || "World Cup team";
        setFlag(assignment.team);

        sendButton.disabled = false;
        copyButton.disabled = false;
        payloadPreview.textContent = JSON.stringify(assignment, null, 2);
        payloadToggle.classList.remove("hidden");
      }

      // ----- Animated reveal -------------------------------------------------

      // Cycle an element through random pool items until `duration` elapses,
      // slowing down near the end, then call onLock(). Returns nothing; the
      // real (pre-chosen) result is rendered by onLock so the draw stays fair.
      function runReel(items, duration, renderFrame, onLock) {
        const start = performance.now();
        function tick() {
          const elapsed = performance.now() - start;
          const t = Math.min(elapsed / duration, 1);
          if (t >= 1) {
            onLock();
            return;
          }
          renderFrame(items[Math.floor(Math.random() * items.length)]);
          // Ease-out cadence: frames get slower as we approach the lock.
          const interval = 55 + t * t * 210;
          setTimeout(tick, interval);
        }
        tick();
      }

      function lockTicket(ticket) {
        ticket.classList.remove("locked");
        // Force reflow so the animation can replay on a repeat draw.
        void ticket.offsetWidth;
        ticket.classList.add("locked");
      }

      function spinReels(pools, assignment) {
        if (reducedMotion) {
          renderAssignment(assignment);
          setStatus("Draw ready.", "good");
          celebrate();
          return;
        }

        isSpinning = true;
        drawButton.disabled = true;
        sendButton.disabled = true;
        copyButton.disabled = true;
        drawStage.classList.add("is-spinning");
        personMeta.textContent = "Drawing...";
        teamMeta.textContent = "Drawing...";

        const namePool = pools.people.length ? pools.people : [assignment.person];
        const teamPool = pools.teams.length ? pools.teams : [assignment.team];

        // Name reel locks first; team reel runs a touch longer for suspense.
        runReel(namePool, 1300, (person) => {
          nameValue.textContent = person.name;
        }, () => {
          nameValue.textContent = assignment.person.name;
          personMeta.textContent = `${assignment.groupTitle}, row ${assignment.person.rowNumber} - ${assignment.person.paid ? "paid" : "not paid"}`;
          lockTicket(ticketName);
        });

        runReel(teamPool, 2300, (team) => {
          teamValue.textContent = team.country;
          setFlag(team);
        }, () => {
          drawStage.classList.remove("is-spinning");
          teamValue.textContent = assignment.team.country;
          teamMeta.textContent = assignment.team.confederation || "World Cup team";
          setFlag(assignment.team);
          lockTicket(ticketTeam);

          // Finalise: enable send/copy, expose payload, celebrate.
          sendButton.disabled = false;
          copyButton.disabled = false;
          payloadPreview.textContent = JSON.stringify(assignment, null, 2);
          payloadToggle.classList.remove("hidden");
          isSpinning = false;
          renderCounts();
          setStatus("Draw ready.", "good");
          celebrate();
        });
      }

      // ----- Confetti --------------------------------------------------------

      const confettiCanvas = document.getElementById("confetti");
      const confettiCtx = confettiCanvas.getContext("2d");
      let confettiParticles = [];
      let confettiRaf = null;

      function sizeConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
      }
      window.addEventListener("resize", sizeConfetti);

      function celebrate() {
        if (reducedMotion) return;
        sizeConfetti();
        const colors = ["#0091d2", "#5ec2ee", "#ffffff", "#c9e8f7"];
        const originX = window.innerWidth / 2;
        const originY = window.innerHeight * 0.4;
        for (let i = 0; i < 170; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 4 + Math.random() * 11;
          confettiParticles.push({
            x: originX + (Math.random() - 0.5) * 240,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 6,
            g: 0.32,
            size: 6 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)],
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 0.4,
            life: 0,
            ttl: 90 + Math.random() * 70
          });
        }
        if (!confettiRaf) confettiLoop();
      }

      function confettiLoop() {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiParticles.forEach((p) => {
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vrot;
          p.life += 1;
          confettiCtx.save();
          confettiCtx.translate(p.x, p.y);
          confettiCtx.rotate(p.rot);
          confettiCtx.globalAlpha = Math.max(0, 1 - p.life / p.ttl);
          confettiCtx.fillStyle = p.color;
          confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          confettiCtx.restore();
        });
        confettiParticles = confettiParticles.filter((p) => p.life < p.ttl && p.y < confettiCanvas.height + 60);
        if (confettiParticles.length) {
          confettiRaf = requestAnimationFrame(confettiLoop);
        } else {
          confettiRaf = null;
          confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
      }

      // ----- Draw + actions --------------------------------------------------

      function drawAssignment() {
        if (!state || isSpinning) return;

        const pools = getDrawPools();
        if (pools.people.length === 0 || pools.teams.length === 0) {
          setStatus("No eligible draw left for this group.", "warn");
          return;
        }

        const person = randomItem(pools.people);
        const team = randomItem(pools.teams);
        currentAssignment = {
          event: "world-cup-sweepstake-assignment",
          assignedAt: new Date().toISOString(),
          groupKey: pools.groupKey,
          groupTitle: sheetTabs[pools.groupKey].title,
          sheetGid: sheetTabs[pools.groupKey].gid,
          person: {
            rowNumber: person.rowNumber,
            firstName: person.firstName,
            lastInitial: person.lastInitial,
            name: person.name,
            paid: person.paid
          },
          team: {
            country: team.country,
            confederation: team.confederation,
            fifaCode: team.fifaCode,
            isoCode: team.isoCode,
            eliminated: team.eliminated
          },
          update: {
            column: "Team",
            value: team.country
          }
        };

        setStatus("Drawing...", "");
        spinReels(pools, currentAssignment);
      }

      async function sendAssignment() {
        if (!currentAssignment) return;
        sendButton.disabled = true;
        drawButton.disabled = true;
        setStatus("Sending assignment to workflow...", "");

        try {
          const response = await fetch("/api/assign", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(currentAssignment)
          });
          const result = await response.json().catch(() => ({}));

          if (!response.ok) {
            setStatus(result.message || "Workflow did not accept the assignment.", response.status === 501 ? "warn" : "bad");
            return;
          }

          // Commit locally before the (eventually-consistent) live re-read so
          // this team is excluded from the pool even if the refresh lags/fails.
          assignedHistory.add(normaliseTeamName(currentAssignment.team.country));
          currentAssignment = null;
          renderCounts();

          setStatus("Assignment sent to workflow.", "good");
          await loadSpreadsheet("live");
        } catch (error) {
          console.warn(error);
          setStatus("Could not reach the assignment endpoint.", "bad");
        } finally {
          sendButton.disabled = false;
          renderCounts();
        }
      }

      async function copyPayload() {
        if (!currentAssignment) return;
        const text = JSON.stringify(currentAssignment, null, 2);
        await navigator.clipboard.writeText(text);
        setStatus("Payload copied.", "good");
      }

      async function loadFromPublishedCsv() {
        const sheets = await Promise.all(Object.entries(sheetTabs).map(([key, tab]) => (
          fetch(getSheetUrl(tab.gid), { cache: "reload" })
            .then((response) => {
              if (!response.ok) throw new Error(`${tab.title} returned ${response.status}`);
              return response.text();
            })
            .then((text) => [key, text])
        )));
        return buildState(Object.fromEntries(sheets));
      }

      async function loadSpreadsheet(sourceLabel) {
        // Preferred: live, uncached data via n8n. Needs the local server
        // (the /api/sheet-live proxy), so skip it when opened as a file://.
        if (window.location.protocol !== "file:") {
          try {
            const response = await fetch("/api/sheet-live", { cache: "no-store" });
            if (!response.ok) throw new Error(`live read returned ${response.status}`);
            state = buildStateFromJson(await response.json());
            renderCounts();
            setStatus(sourceLabel === "live" ? "Refreshed live from n8n." : "Reading live from n8n.", "good");
            return;
          } catch (error) {
            console.warn("Live n8n read failed; falling back to published CSV.", error);
          }
        }

        // Fallback: published CSV (cached by Google, so it may lag).
        try {
          state = await loadFromPublishedCsv();
          renderCounts();
          setStatus("Live read unavailable — using the published spreadsheet (may lag).", "warn");
        } catch (error) {
          console.warn(error);
          state = buildState(fallbackData);
          renderCounts();
          setStatus("Showing the saved copy because no live source could be reached.", "warn");
        }
      }

      groupSelect.addEventListener("change", () => {
        if (isSpinning) return;
        currentAssignment = null;
        sendButton.disabled = true;
        copyButton.disabled = true;
        payloadPreview.classList.add("hidden");
        payloadToggle.classList.add("hidden");
        payloadToggle.textContent = "Show payload";
        nameValue.textContent = "Ready";
        teamValue.textContent = "Ready";
        personMeta.textContent = "Choose a group and draw";
        teamMeta.textContent = "Choose a group and draw";
        flagEl.classList.add("hidden");
        flagPlaceholder.classList.remove("hidden");
        renderCounts();
      });
      paidOnly.addEventListener("change", () => {
        if (!isSpinning) renderCounts();
      });
      drawButton.addEventListener("click", drawAssignment);
      sendButton.addEventListener("click", sendAssignment);
      copyButton.addEventListener("click", copyPayload);
      payloadToggle.addEventListener("click", () => {
        const hidden = payloadPreview.classList.toggle("hidden");
        payloadToggle.textContent = hidden ? "Show payload" : "Hide payload";
      });

      loadSpreadsheet();
    </script>
  </body>
</html>
